# Application Configuration
spring.application.name=Basketball Stats API
server.port=8080

# HTTP Encoding Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# CRITICAL: Disable DevTools to prevent repeated initialization
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Firebase Configuration (Fallback only - R2 is primary)
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:serviceAccountKey.json}
firebase.database.url=${FIREBASE_DATABASE_URL:}

# Cloudflare R2 Configuration (S3-compatible storage - FREE tier)
r2.enabled=${R2_ENABLED:true}
r2.endpoint=${R2_ENDPOINT:https://43db10a8f93f856bf9d1f5da4eab67f5.r2.cloudflarestorage.com}
r2.access-key=${R2_ACCESS_KEY:1eff105b63bff5c4983cf71c86a944ef}
r2.secret-key=${R2_SECRET_KEY:4b97d5e8ce8cdee03fcccc0aa683655122c046dff7101dc9298809ccc43072a0}
r2.bucket-name=${R2_BUCKET_NAME:hoops}

# Caching Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=12h

# Scheduler Configuration
scheduler.enabled=${SCHEDULER_ENABLED:false}
scheduler.daily.cron=0 0 2 * * *
scheduler.weekly.cron=0 0 3 * * SUN
scheduler.timezone=America/New_York

# Live Polling Configuration
live.polling.enabled=${LIVE_POLLING_ENABLED:false}
live.polling.interval.seconds=10

# BallDontLie API Configuration
balldontlie.api.base-url=https://api.balldontlie.io/v1
balldontlie.api.rate-limit=30

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,cache
management.endpoint.health.show-details=always

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
# Disable try-it-out by default to prevent accidental quota exhaustion
springdoc.swagger-ui.tryItOutEnabled=false

# Logging Configuration
logging.level.com.hoops.stats=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
